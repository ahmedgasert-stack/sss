<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كَلِّمْنِي - تطبيق التواصل للأطفال (AAC)</title>
  
  <!-- PWA & Mobile Viewport Tags -->
  <meta name="theme-color" content="#f59e0b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Cairo', 'Tajawal', system-ui, sans-serif;
      touch-action: manipulation;
    }
    input {
      user-select: text;
      -webkit-user-select: text;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* أنيميشن ناعم ومريح للأطفال عند لمس البطاقة */
    .card-touch {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
    }
    .card-touch:active {
      transform: scale(0.94);
      filter: brightness(0.96);
    }
    @keyframes speakPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    .speaking-card {
      animation: speakPulse 0.4s ease-in-out;
      outline: 4px solid #f59e0b;
      outline-offset: 2px;
    }
  </style>
</head>

       ========================================================================= */

      { id: 13, text: "بحبك أوي", speech: "بحبك اوي يا روحي", icon: "❤️", cat: "feelings", bg: "bg-amber-50 border-amber-300 text-amber-950 ring-amber-400" },
      { id: 14, text: "أنا زهقان", speech: "انا زهقان وملان", icon: "😑", cat: "feelings", bg: "bg-amber-50 border-amber-300 text-amber-950 ring-amber-400" },

      // الفئة الثالثة: أنشطة ولعب (أزرق سماوي)
      { id: 15, text: "عاوز ألعب", speech: "عاوز العب باللعب", icon: "🧸", cat: "activities", bg: "bg-sky-50 border-sky-300 text-sky-950 ring-sky-400" },
      { id: 16, text: "عاوز أتفرّج ع التلفزيون", speech: "عاوز اتفرّج ع التلفزيون", icon: "📺", cat: "activities", bg: "bg-sky-50 border-sky-300 text-sky-950 ring-sky-400" },
      { id: 17, text: "عاوز أرسم", speech: "عاوز ارسم والوّن", icon: "🎨", cat: "activities", bg: "bg-sky-50 border-sky-300 text-sky-950 ring-sky-400" },
      { id: 18, text: "عاوز أسمع مزيكا", speech: "عاوز اسمع مزيكا واغاني", icon: "🎵", cat: "activities", bg: "bg-sky-50 border-sky-300 text-sky-950 ring-sky-400" },
      { id: 19, text: "عاوز أخرج برّه", speech: "عاوز اخرج برّه الشقة", icon: "🚪", cat: "activities", bg: "bg-sky-50 border-sky-300 text-sky-950 ring-sky-400" },
      { id: 20, text: "عاوز أروح الجنينة", speech: "عاوز اروح الجنينة العب", icon: "🌳", cat: "activities", bg: "bg-sky-50 border-sky-300 text-sky-950 ring-sky-400" },
      { id: 21, text: "عاوز حضن", speech: "عاوز حضن كبير", icon: "🫂", cat: "activities", bg: "bg-sky-50 border-sky-300 text-sky-950 ring-sky-400" },

      // الفئة الرابعة: ردود وكلام وتواصل (بنفسجي)
      { id: 22, text: "آه / أيوه", speech: "ايوه تمام", icon: "👍", cat: "social", bg: "bg-purple-50 border-purple-300 text-purple-950 ring-purple-400" },
      { id: 23, text: "لأ مش عاوز", speech: "لأ مش عاوز ده", icon: "👎", cat: "social", bg: "bg-purple-50 border-purple-300 text-purple-950 ring-purple-400" },
      { id: 24, text: "ساعدني لو سمحت", speech: "ساعدني لو سمحت محتاج مساعدة", icon: "🆘", cat: "social", bg: "bg-purple-50 border-purple-300 text-purple-950 ring-purple-400" },
      { id: 25, text: "استنى شوية", speech: "استنى شوية عليا", icon: "✋", cat: "social", bg: "bg-purple-50 border-purple-300 text-purple-950 ring-purple-400" },
      { id: 26, text: "خلاص كفاية كده", speech: "خلاص كفاية كده مش عاوز تاني", icon: "🛑", cat: "social", bg: "bg-purple-50 border-purple-300 text-purple-950 ring-purple-400" },
      { id: 27, text: "تاني كمان مرة", speech: "تاني كمان مرة لو سمحت", icon: "🔁", cat: "social", bg: "bg-purple-50 border-purple-300 text-purple-950 ring-purple-400" },
      { id: 28, text: "شكراً ليك", speech: "شكراً ليك يا حبيبي", icon: "🙏", cat: "social", bg: "bg-purple-50 border-purple-300 text-purple-950 ring-purple-400" },
      { id: 29, text: "عاوز ماما", speech: "عاوز ماما", icon: "👩", cat: "social", bg: "bg-purple-50 border-purple-300 text-purple-950 ring-purple-400" },
      { id: 30, text: "عاوز بابا", speech: "عاوز بابا", icon: "👨", cat: "social", bg: "bg-purple-50 border-purple-300 text-purple-950 ring-purple-400" }
    ];

    // حالة التطبيق
    let activeFilter = 'all';
    let currentSentence = [];
    let recentSpokenHistory = JSON.parse(localStorage.getItem('aac_egyptian_history') || '["عاوز أشرب", "عاوز آكل", "شكراً ليك"]');
    
    // متغيرات مشغل الصوت
    let audioContext = null;
    let activeAudioTag = null;
    window._lastUtterance = null; // حماية من خطأ متصفح كروم

    /* =========================================================================
       2. نظام فك الصوت التلقائي + نغمة تأكيد لمس البطاقة الفورية
       ========================================================================= */
    function initOrResumeAudioContext() {
      try {
        if (!audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioContext = new AudioCtx();
        }
        if (audioContext && audioContext.state === 'suspended') {
          audioContext.resume();
        }
      } catch (err) {
        console.warn('AudioContext init note:', err);
      }
    }

    // تشغيل نغمة لطيفة وهادئة فوراً عند لمس أي كارت ليعرف الطفل أن لمسته استجابت
    function playGentleTouchChime() {
      try {
        initOrResumeAudioContext();
        if (!audioContext) return;
        
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // نغمة D5 ناعمة
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08); // صعود خفيف لـ A5

        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(now);
        osc.stop(now + 0.13);
      } catch (e) {
        // تجاهل أي خطأ دون تعطيل التطبيق
      }
    }

    /* =========================================================================
       3. محرك النطق المصري الذكي المزدوج (Web Speech + Online Stream)
       ========================================================================= */
    function updateStatusIndicator(msg, state = 'normal') {
      const box = document.getElementById('liveStatusBox');
      const text = document.getElementById('liveStatusText');
      const dot = document.getElementById('liveStatusDot');
      if (!box || !text) return;

      text.textContent = msg;

      if (state === 'speaking') {
        box.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-black bg-amber-100 text-amber-950 border border-amber-300 animate-pulse';
        dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping';
      } else if (state === 'success') {
        box.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-black bg-emerald-100 text-emerald-950 border border-emerald-300';
        dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
      } else if (state === 'error') {
        box.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-black bg-rose-100 text-rose-950 border border-rose-300';
        dot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
      } else {
        box.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-black bg-slate-100 text-slate-800 border border-slate-300';
        dot.className = 'w-2.5 h-2.5 rounded-full bg-slate-400';
      }
    }

    function speakEgyptian(phraseText) {
      if (!phraseText || !phraseText.trim()) return;
      const clean = phraseText.trim();

      // نغمة تأكيد سريعة
      playGentleTouchChime();

      // اهتزاز لمسي خفيف على الموبايل
      if (navigator.vibrate) navigator.vibrate(25);

      // إضافة للسجل
      addPhraseToHistory(clean);

      // إلغاء أي صوت سابق لمنع التداخل
      if (activeAudioTag) {
        activeAudioTag.pause();
        activeAudioTag = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
      }

      updateStatusIndicator(`بيقول: "${clean}"...`, 'speaking');

      // 1. تجربة محرك الهاتف أولاً (Web Speech API)
      let usedNative = false;
      if ('speechSynthesis' in window) {
        try {
          const utter = new SpeechSynthesisUtterance(clean);
          utter.lang = 'ar-EG';
          utter.rate = 0.86; // إيقاع مصري هادئ ومناسب للطفل
          utter.pitch = 1.05;

          const voices = window.speechSynthesis.getVoices() || [];
          const egyptianVoice = voices.find(v => v.lang && (v.lang.toLowerCase().includes('ar-eg') || v.lang.toLowerCase().includes('ar_eg'))) ||
                                voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar'));

          if (egyptianVoice) utter.voice = egyptianVoice;

          utter.onstart = () => updateStatusIndicator(`بيقول: "${clean}" 🔊`, 'speaking');
          utter.onend = () => updateStatusIndicator('اتنطقت تمام ✅', 'success');
          utter.onerror = () => fallbackAudioStream(clean);

          window._lastUtterance = utter;
          window.speechSynthesis.speak(utter);
          usedNative = true;
          
          // مؤقت أمان في حال علّق محرك الهاتف
          setTimeout(() => {
            if (document.getElementById('liveStatusText').textContent.includes('بيقول:')) {
              updateStatusIndicator('جاهز للنطق', 'normal');
            }
          }, 3200);

          return;
        } catch (e) {
          console.warn('Native speech error, switching to fallback:', e);
        }
      }

      // 2. إذا لم يكن محرك الجهاز متاحاً أو فشل، استخدام الرابط الصوتي المباشر
      if (!usedNative) {
        fallbackAudioStream(clean);
      }
    }

    // المسار البديل الصوتي السريع والموثوق
    function fallbackAudioStream(text) {
      try {
        updateStatusIndicator(`بيقول بالمصري 🌐: "${text}"`, 'speaking');
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q=${encodeURIComponent(text)}`;
        const audio = new Audio();
        audio.referrerPolicy = 'no-referrer';
        audio.src = url;
        activeAudioTag = audio;

        audio.onended = () => updateStatusIndicator('اتنطقت تمام ✅', 'success');
        audio.onerror = () => updateStatusIndicator('تأكد من فتح الصفحة في Google Chrome', 'error');

        audio.play().catch(() => {
          updateStatusIndicator('اضغط على الشاشة لسماع الصوت', 'error');
        });
      } catch (err) {
        updateStatusIndicator('خطأ في تشغيل الصوت', 'error');
      }
    }

    function testEgyptianVoice() {
      speakEgyptian("الصوت شغال تمام التمام بالمصري يا بطل");
    }

    /* =========================================================================
       4. رسم وعرض شبكة الـ 30 بطاقة والتفاعل معها
       ========================================================================= */
    function renderCardsGrid() {
      const grid = document.getElementById('cardsGridContainer');
      if (!grid) return;
      grid.innerHTML = '';

      const filtered = activeFilter === 'all' 
        ? AAC_CARDS 
        : AAC_CARDS.filter(c => c.cat === activeFilter);

      filtered.forEach(card => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.id = `card_btn_${card.id}`;
        btn.className = `card-touch relative rounded-3xl border-2 p-3 sm:p-4 flex flex-col items-center justify-between text-center cursor-pointer shadow-xs min-h-[142px] sm:min-h-[160px] ${card.bg}`;

        btn.innerHTML = `
          <div class="w-16 h-16 sm:w-20 sm:h-20 flex items-center justify-center p-1 rounded-2xl bg-white/80 shadow-inner mb-2 pointer-events-none">
            <span class="text-4xl sm:text-5xl filter drop-shadow-xs">${card.icon}</span>
          </div>
          <span class="font-black text-sm sm:text-base leading-snug pointer-events-none">
            ${card.text}
          </span>
        `;

        // عند الضغط على أي بطاقة: تنطق فوراً وتضاف للجملة دون أي تأخير
        btn.onclick = () => {
          btn.classList.add('speaking-card');
          setTimeout(() => btn.classList.remove('speaking-card'), 450);

          speakEgyptian(card.speech);
          addCardToSentence(card);
        };

        grid.appendChild(btn);
      });
    }

    /* =========================================================================
       5. منطق شريط تركيب الجملة المركبة
       ========================================================================= */
    function addCardToSentence(card) {
      currentSentence.push(card);
      updateSentenceUI();
    }

    function updateSentenceUI() {
      const container = document.getElementById('sentenceBuilderList');
      const speakBtn = document.getElementById('btnSpeakSentence');
      if (!container) return;

      if (currentSentence.length === 0) {
        container.innerHTML = `
          <span id="sentencePlaceholder" class="text-slate-400 text-xs sm:text-sm font-medium pr-1">
            اضغط على البطاقات لتجميع جملة هنا (مثال: "عاوز أشرب" + "شكراً ليك")...
          </span>
        `;
        speakBtn.classList.add('hidden');
        return;
      }

      speakBtn.classList.remove('hidden');
      container.innerHTML = '';

      currentSentence.forEach((item, index) => {
        const chip = document.createElement('div');
        chip.className = 'flex items-center gap-1 bg-white border border-slate-300 text-slate-800 font-black px-2.5 py-1.5 rounded-xl text-xs sm:text-sm shadow-xs shrink-0';
        chip.innerHTML = `
          <span>${item.icon}</span>
          <span>${item.text}</span>
          <button type="button" onclick="removeSentenceIndex(${index})" class="text-slate-400 hover:text-rose-600 mr-1 text-xs">✕</button>
        `;
        container.appendChild(chip);
      });
    }

    function removeSentenceIndex(index) {
      currentSentence.splice(index, 1);
      updateSentenceUI();
    }

    function undoLastSentenceItem() {
      if (currentSentence.length > 0) {
        currentSentence.pop();
        updateSentenceUI();
      }
    }

    function clearFullSentence() {
      currentSentence = [];
      updateSentenceUI();
    }

    function speakCompoundSentence() {
      if (currentSentence.length === 0) return;
      const combined = currentSentence.map(c => c.speech).join(' ، و ');
      speakEgyptian(combined);
    }

    /* =========================================================================
       6. خانة الكتابة الحرة وسجل العبارات السريعة
       ========================================================================= */
    const customInput = document.getElementById('customTextInput');
    const clearInputBtn = document.getElementById('btnClearInput');

    customInput.oninput = () => {
      if (customInput.value.trim()) clearInputBtn.classList.remove('hidden');
      else clearInputBtn.classList.add('hidden');
    };

    customInput.onkeydown = (e) => {
      if (e.key === 'Enter') speakCustomText();
    };

    function clearCustomInput() {
      customInput.value = '';
      clearInputBtn.classList.add('hidden');
    }

    function speakCustomText() {
      const val = customInput.value.trim();
      if (val) {
        speakEgyptian(val);
      }
    }

    function addPhraseToHistory(phrase) {
      if (!phrase) return;
      recentSpokenHistory = [phrase, ...recentSpokenHistory.filter(p => p !== phrase)].slice(0, 8);
      localStorage.setItem('aac_egyptian_history', JSON.stringify(recentSpokenHistory));
      renderHistoryChips();
    }

    function renderHistoryChips() {
      const container = document.getElementById('recentHistoryChips');
      if (!container) return;
      container.innerHTML = '';

      recentSpokenHistory.forEach(text => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'flex items-center gap-1 bg-slate-100 hover:bg-amber-100 active:scale-95 text-slate-700 hover:text-amber-950 px-2.5 py-1 rounded-full text-xs font-bold whitespace-nowrap border border-slate-200 transition-all';
        chip.innerHTML = `<span>🔊</span><span>${text}</span>`;
        chip.onclick = () => speakEgyptian(text);
        container.appendChild(chip);
      });
    }

    /* =========================================================================
       7. فلاتر الفئات والتهيئة التلقائية الفورية
       ========================================================================= */
    function applyCategoryFilter(catName, btnElem) {
      activeFilter = catName;

      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.className = 'cat-pill px-3.5 py-2 rounded-2xl text-xs sm:text-sm font-bold whitespace-nowrap bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 transition-all';
      });

      if (btnElem) {
        btnElem.className = 'cat-pill px-4 py-2 rounded-2xl text-xs sm:text-sm font-black whitespace-nowrap bg-slate-900 text-white shadow-xs transition-all';
      }

      renderCardsGrid();
    }

    // تفعيل فك حظر الصوت العالمي عند أول لمسة في أي مكان في الصفحة
    document.addEventListener('pointerdown', () => {
      initOrResumeAudioContext();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.resume();
      }
    }, { once: true });

    // تحميل الأصوات في المتصفح مسبقاً
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // تشغيل الصفحة مباشرة
    renderCardsGrid();
    renderHistoryChips();
  </script>
</body>
</html>
